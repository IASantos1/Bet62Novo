# Extra system libraries Chromium needs to actually *launch* under Nixpacks
# (Railway's build environment has no apt-get, so Playwright's own
# `--with-deps` installer has nothing to work with — these are the Nix
# package equivalents of the .deb packages Playwright would normally pull
# in). Nixpacks merges this `nixPkgs` list into the auto-detected setup
# phase rather than replacing it, so node/pnpm detection is unaffected.
[phases.setup]
nixPkgs = [
  "nss",
  "nspr",
  "atk",
  "at-spi2-atk",
  "at-spi2-core",
  "cups",
  "dbus",
  "expat",
  "libdrm",
  "libxkbcommon",
  "mesa",
  "pango",
  "cairo",
  "alsa-lib",
  "gtk3",
  "gdk-pixbuf",
  "glib",
  "xorg.libX11",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "xorg.libxcb",
  "xorg.libxshmfence",
  "xorg.libXtst",
  "freetype",
  "fontconfig",
]
